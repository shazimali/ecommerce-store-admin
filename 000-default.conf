# ==============================================================================
# VPS Host VirtualHost Configuration for everydaygroup.co (Port 85 Docker proxy)
# ==============================================================================

# ------------------------------------------------------------------------------
# APACHE CONFIGURATION (/etc/apache2/sites-available/000-default.conf)
# ------------------------------------------------------------------------------
# Make sure proxy modules are enabled on VPS:
# sudo a2enmod proxy proxy_http
#
# <VirtualHost *:80>
#     ServerName everydaygroup.co
#     ServerAlias www.everydaygroup.co
# 
#     ProxyPreserveHost On
#     ProxyPass / http://127.0.0.1:85/
#     ProxyPassReverse / http://127.0.0.1:85/
# 
#     ErrorLog ${APACHE_LOG_DIR}/everydaygroup_error.log
#     CustomLog ${APACHE_LOG_DIR}/everydaygroup_access.log combined
# </VirtualHost>

# ------------------------------------------------------------------------------
# NGINX CONFIGURATION (/etc/nginx/sites-available/000-default.conf)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name everydaygroup.co www.everydaygroup.co;

    location / {
        proxy_pass http://127.0.0.1:85;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Pusher / Laravel Echo real-time connections
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
